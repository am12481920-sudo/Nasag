<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سلة التسوق | نُسج</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="cart.js"></script></head><body>
<header class="header"><a class="logo" href="index.html">نُسج<small>NUSJ STUDIO</small></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="shop.html">تسوّق</a><a href="story.html">حكايتنا</a><a href="contact.html">تواصل معنا</a></nav><div class="actions"><a class="icon-btn" href="shop.html" aria-label="تسوّق">⌕</a><a class="icon-btn cart-link" href="cart.html" aria-label="السلة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.1 11.1a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span class="cart-count">0</span></a></div></header>
<main class="section cart-page"><div class="section-head"><div><div class="eyebrow">اختياراتك</div><h2>سلة التسوق</h2></div><a class="text-link" href="shop.html">متابعة التسوق ←</a></div><div class="cart-layout"><div class="cart-list" id="cartList"></div><aside class="cart-summary" id="cartSummary"></aside></div></main><footer class="footer"><span>© ٢٠٢٥ نُسج ستوديو. صُنع بحب في مصر.</span><span><a href="story.html">حكايتنا</a><a href="contact.html">تواصل معنا</a></span></footer>
<script>
const money=n=>new Intl.NumberFormat('ar-EG').format(n)+' ج.م';
function renderCart(){const items=NusjCart.read(),list=document.getElementById('cartList'),summary=document.getElementById('cartSummary');if(!items.length){list.innerHTML='<div class="empty-cart"><strong>سلتك فارغة حالياً</strong><span>اكتشف قطع نُسج واختر ما يناسبك.</span><br><a class="primary" href="shop.html">تسوّق المجموعة <span>←</span></a></div>';summary.hidden=true;return}summary.hidden=false;list.innerHTML=items.map(item=>`<article class="cart-row"><a href="product.html?name=${encodeURIComponent(item.name)}"><img src="${item.img}" alt="${item.name}"></a><div><h3>${item.name}</h3><p>${[item.color,item.size&&("المقاس "+item.size)].filter(Boolean).join(" · ")||"قطعة مختارة من نُسج"}</p><strong class="price">${money(item.price)}</strong></div><div class="qty-control"><button data-action="minus" data-key="${item.id||[item.name,item.size||'',item.color||''].join('::')}" aria-label="تقليل الكمية">−</button><span>${item.qty}</span><button data-action="plus" data-key="${item.id||[item.name,item.size||'',item.color||''].join('::')}" aria-label="زيادة الكمية">＋</button></div><button class="remove-item" data-action="remove" data-key="${item.id||[item.name,item.size||'',item.color||''].join('::')}" aria-label="حذف المنتج">×</button></article>`).join('');const total=items.reduce((sum,item)=>sum+item.price*item.qty,0);summary.innerHTML=`<h3>ملخص الطلب</h3><div class="summary-line"><span>عدد القطع</span><span>${items.reduce((sum,item)=>sum+item.qty,0)}</span></div><div class="summary-line"><span>الشحن</span><span>يُحسب عند تأكيد الطلب</span></div><div class="summary-line summary-total"><span>الإجمالي</span><span>${money(total)}</span></div><button class="primary" id="checkout">إتمام الطلب <span>←</span></button>`;document.getElementById('checkout').onclick=()=>location.href='checkout.html'}
document.getElementById('cartList').onclick=e=>{const button=e.target.closest('[data-action]');if(!button)return;const name=button.dataset.key;if(button.dataset.action==='plus')NusjCart.change(name,1);else if(button.dataset.action==='minus')NusjCart.change(name,-1);else NusjCart.remove(name);renderCart()};window.addEventListener('nusj-cart-changed',renderCart);renderCart();
</script></body></html>
