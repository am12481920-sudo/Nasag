<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تسوّق | نُسج</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><script src="cart.js" defer></script></head><body>
<header class="header"><a class="logo" href="index.html">نُسج<small>NUSJ STUDIO</small></a><nav class="nav"><a href="index.html">الرئيسية</a><a href="shop.html">تسوّق</a><a href="story.html">حكايتنا</a><a href="contact.html">تواصل معنا</a></nav><div class="actions"><a class="icon-btn" href="#products">⌕</a><a class="icon-btn cart-link" href="cart.html" aria-label="السلة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.1 11.1a2 2 0 0 0 2 1.6h8.7a2 2 0 0 0 2-1.6L21 8H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span class="cart-count">0</span></a></div></header>
<main><section class="section"><div class="section-head"><div><div class="eyebrow">اختيارات نُسج</div><h2>تسوّق المجموعة</h2></div><p>قطع تحبها كل يوم، بتفاصيل بسيطة وفرق كبير.</p></div><div class="filters"><button class="filter active" data-filter="all">كل المنتجات</button><button class="filter" data-filter="women">نسائي</button><button class="filter" data-filter="men">رجالي</button><button class="filter" data-filter="accessories">إكسسوارات</button></div><div class="products" id="products"></div></section></main><div class="toast" id="toast"></div><footer class="footer"><span>© ٢٠٢٥ نُسج ستوديو. صُنع بحب في مصر.</span><span><a href="story.html">حكايتنا</a><a href="contact.html">تواصل معنا</a></span></footer>
<script>
const items=[
{name:'قميص كتان واسع',cat:'women',label:'الأكثر مبيعاً',price:'٨٩٠',value:890,img:'photo-1598554747436-c9293d6a588f'},
{name:'جاكيت يومي خفيف',cat:'men',label:'جديد',price:'١,٤٥٠',value:1450,img:'photo-1617137968427-85924c800a22'},
{name:'فستان ندى القطني',cat:'women',label:'قطعة محدودة',price:'١,٢٥٠',value:1250,img:'photo-1515886657613-9f3515b0c78f'},
{name:'حقيبة كتف جلدية',cat:'accessories',label:'',price:'٧٩٠',value:790,img:'photo-1584917865442-de89df76afd3'},
{name:'تيشيرت قطن عضوي',cat:'men',label:'خامة طبيعية',price:'٥٩٠',value:590,img:'photo-1521572163474-6864f9cf17ab'},
{name:'قميص مخطط كلاسيك',cat:'women',label:'',price:'٨٥٠',value:850,img:'photo-1594633312681-425c7b97ccd1'},
{name:'نظارة شمسية ريترو',cat:'accessories',label:'جديد',price:'٦٥٠',value:650,img:'photo-1511499767150-a48a237f0083'},
{name:'بنطال قطن مريح',cat:'men',label:'اختيارنا',price:'٩٥٠',value:950,img:'photo-1473966968600-fa801b869a1a'}];
let filter='all';function draw(){const root=document.getElementById('products');root.innerHTML='';items.filter(x=>filter==='all'||x.cat===filter).forEach(x=>{const a=document.createElement('article');a.className='product';a.innerHTML=`<div class="product-photo"><img loading="lazy" src="https://images.unsplash.com/${x.img}?w=700&h=850&fit=crop" alt="${x.name}">${x.label?`<span class="badge">${x.label}</span>`:''}<button class="quick-add" aria-label="أضف ${x.name}">＋</button></div><div class="product-meta"><a class="product-title product-open" href="product.html?name=${encodeURIComponent(x.name)}">${x.name}</a><a class="product-open-cta" href="product.html?name=${encodeURIComponent(x.name)}">عرض التفاصيل <span>←</span></a><div class="product-detail"><span>نُسج</span><span class="price">${x.price} ج.م</span></div><div class="swatches"><i class="swatch" style="background:#d8c8b4"></i><i class="swatch" style="background:#555d4d"></i><i class="swatch" style="background:#b2a399"></i></div></div>`;a.querySelector('.product-photo img').onclick=()=>location.href='product.html?name='+encodeURIComponent(x.name);a.querySelector('.product-title').onclick=()=>location.href='product.html?name='+encodeURIComponent(x.name);a.querySelector('button').onclick=()=>{NusjCart.add({name:x.name,price:x.value,priceText:x.price,img:'https://images.unsplash.com/'+x.img+'?w=700&h=850&fit=crop'});const t=document.getElementById('toast');t.textContent='تمت إضافة '+x.name+' إلى السلة';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};root.appendChild(a)})}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');filter=b.dataset.filter;draw()});draw();
</script></body></html>
